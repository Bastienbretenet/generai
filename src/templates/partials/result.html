<form id="apply-form">
    <textarea id="sql-content" name="sql" class="sql-editor">{{ sql }}</textarea>
    <input type="hidden" name="prompt" value="{{ prompt }}">
    <input type="hidden" name="steps" value="{{ steps }}">
    <input type="hidden" name="hash_method" id="apply-hash-method" value="">
    <button
        type="button"
        hx-post="/apply"
        hx-target="#apply-result"
        hx-include="#apply-form"
        onclick="document.getElementById('apply-hash-method').value = document.getElementById('hash_method').value"
    >
        Appliquer
    </button>
</form>
<div id="apply-result"></div>
