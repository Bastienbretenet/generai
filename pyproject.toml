[project]
name = "generai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.97.0",
    "openai>=1.0.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]==0.136.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "psycopg[binary]==3.2.3",
    "pymysql==1.1.1",
    "python-multipart>=0.0.27",
    "sqlalchemy==2.0.49",
    "uuid7>=0.1.0",
    "uuid6>=2025.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
